name: openroster

services:
  pocketbase:
    build:
      context: ./pb
      args:
        PB_VERSION: "0.40.6"
    ports:
      - "8097:8090"
    volumes:
      - pb_data:/pb_data
    restart: unless-stopped
    mem_limit: 512m
    cpus: 1.0
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8090/api/health"]
      interval: 10s
      timeout: 3s
      retries: 5

  web:
    build:
      context: ./web
      args:
        NEXT_PUBLIC_PB_URL: ${NEXT_PUBLIC_PB_URL:-http://localhost:8097}
    ports:
      - "3000:3000"
    depends_on:
      pocketbase:
        condition: service_healthy
    restart: unless-stopped
    mem_limit: 512m
    cpus: 1.0
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/login"]
      interval: 15s
      timeout: 5s
      retries: 5

volumes:
  pb_data:
