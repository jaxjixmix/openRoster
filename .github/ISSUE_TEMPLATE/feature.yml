name: Feature request
description: Suggest a focused improvement
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem are you trying to solve?
      description: Describe the workflow, not only the feature.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Scheduling
        - Time clock
        - Timesheets
        - Payroll
        - People / PTO
        - Setup / auth
        - Settings
        - Reports / exports
        - Deployment / Docker
        - Other
